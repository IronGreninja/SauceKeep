include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # exclude generated code
    - '**.g.dart'

plugins:
  riverpod_lint: 3.2.0

formatter:
  # page_width: 123
  trailing_commas: preserve
