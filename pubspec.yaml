name: SauceKeep
description: "Simple tag based sauce storage and management."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  collection: ^1.19.1
  flex_color_picker: ^4.0.0
  material_ui: ^1.11.1
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
